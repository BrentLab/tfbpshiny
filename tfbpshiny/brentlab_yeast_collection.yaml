          the start codon. Targets are scored by the nearest, median, and max
          -log10(q) of the peaks in the promoter.
        db_name: rossi_peaks_500bp
        sample_id:
          field: sample_id
        Regulator locus tag:
          field: regulator_locus_tag
        Regulator symbol:
          field: regulator_symbol
      macs_intergenic:
        tags:
          display_name: "2021 ChIP-exo Peaks (MACS, Intergenic)"
          promoter_set: "intergenic"
          binding_method: "peak_calling"
        description: >-
