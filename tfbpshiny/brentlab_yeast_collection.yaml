    glucose: [D-glucose, dextrose, glu]
    galactose: [D-galactose, gal]
    raffinose: [D-raffinose]

missing_value_labels:
  Carbon source: unspecified
  Temperature: unspecified

description:
  Carbon source: The carbon source provided during growth
  Temperature: Growth temperature in degrees Celsius

# ---------------------------------------------------------------------------
# tfbpshiny application vocabularies (read by tfbpshiny/config.py; labretriever
# ignores this section). Per-dataset facts live in each repository's / dataset's
# `tags` above; these are the promoter-set and binding-method definitions those tags
# refer to. A promoter set with a `region_set` takes its description from
# repositories.BrentLab/yeast_genome_resources.genome_resources.region_sets.
# ---------------------------------------------------------------------------
tfbpshiny:
  promoter_sets:
    kang:
      display_name: Kang
      region_set: Kang
      reference: https://doi.org/10.1101/gr.259655.119
      color: "#377EB8"
    mindel:
      display_name: Mindel
      region_set: Mindel
      reference: https://doi.org/10.1101/2025.10.12.681120
      color: "#4DAF4A"
    500bp:
      display_name: 500bp
      region_set: start_codon_500bp
      color: "#984EA3"
    intergenic:
      display_name: Intergenic
      region_set: intergenic
      color: "#FF7F00"
    peaks:
      display_name: Peaks
      description: >-
        Regions as called by the original authors' peak-calling pipeline; not a
        fixed promoter window.
    array:
      display_name: Array Probes
      description: >-
        Regions fixed by the ChIP-chip microarray platform. Not a promoter window and
        not re-quantifiable over one: the source ships per-target binding ratios with
        no underlying signal track to re-summarise.
  binding_methods:
    promoter_enrichment:
      display_name: Promoter Enrichment
      color: "#4DBBD5"
    peak_calling:
      display_name: Peak Calling
      color: "#E64B35"
